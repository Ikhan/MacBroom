[package]
name = "macbroom"
version = "0.1.0"
edition = "2024"
description = "Fast, low-memory macOS cleaner & optimizer (CleanMyMac-style) written in Rust"
license = "MIT"

[[bin]]
name = "macbroom"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "color"] }
crossterm = "0.29.0"
libc = "0.2.190"
plist = { version = "1.10.1", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network", "component"] }
trash = { version = "5.2.9", default-features = false }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
